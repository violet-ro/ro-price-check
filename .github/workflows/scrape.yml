name: Daily Vending Scrape

on:
  schedule:
    # 06:00 UTC every day. Change the cron expression to shift the time.
    - cron: '0 6 * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: vending-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        working-directory: scraper
        run: npm install

      - name: Run scraper
        working-directory: scraper
        env:
          VENDING_SESSION_COOKIE: ${{ secrets.VENDING_SESSION_COOKIE }}
        run: npm run scrape

      - name: Commit updated data
        run: |
          git config user.name "vending-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/vending-history.json
          git diff --cached --quiet || git commit -m "Update vending data: $(date -u +'%Y-%m-%d')"
          git push
